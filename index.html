<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Daginfo</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --ink: #12212d;
      --muted: #61707b;
      --line: #dce3e8;
      --accent: #1d6f7a;
      --shadow: 0 12px 36px rgba(20, 39, 52, .10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; overflow: hidden; }
    .screen { min-height: 100vh; padding: clamp(24px, 3vw, 56px); display: grid; grid-template-rows: auto 1fr auto; gap: clamp(22px, 2.4vw, 38px); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; border-bottom: 1px solid var(--line); padding-bottom: clamp(18px, 1.8vw, 28px); }
    .brand { display: flex; align-items: center; gap: 18px; }
    .mark { width: 16px; height: 58px; border-radius: 999px; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(40px, 4.3vw, 76px); line-height: .95; letter-spacing: -.045em; }
    .subtitle { margin-top: 10px; color: var(--muted); font-weight: 600; font-size: clamp(18px, 1.35vw, 26px); }
    .clock { text-align: right; flex: 0 0 auto; }
    .date { font-size: clamp(20px, 1.7vw, 30px); font-weight: 700; color: var(--muted); }
    .time { margin-top: 4px; font-size: clamp(42px, 4vw, 70px); font-weight: 800; letter-spacing: -.035em; }
    main { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: clamp(18px, 1.7vw, 30px); }
    .category { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: clamp(22px, 2vw, 34px); box-shadow: var(--shadow); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .category h2 { margin: 0 0 18px; font-size: clamp(24px, 2.15vw, 38px); letter-spacing: -.025em; display: flex; align-items: center; gap: 12px; }
    .category h2:before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .items { display: grid; gap: 12px; min-height: 0; overflow: hidden; }
    .item { display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; padding-top: 0; }
    .item-time { min-width: 84px; font-weight: 800; color: var(--accent); font-size: clamp(21px, 1.45vw, 28px); }
    .item-title { font-weight: 800; font-size: clamp(22px, 1.55vw, 30px); line-height: 1.13; }
    .item-details { color: var(--muted); font-size: clamp(17px, 1.2vw, 23px); line-height: 1.32; margin-top: 4px; }
    .empty { color: var(--muted); font-size: clamp(20px, 1.3vw, 26px); padding-top: 10px; }
    footer { display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-size: clamp(14px, 1vw, 18px); }
    .status { display: flex; align-items: center; gap: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 999px; background: #2f8d65; }
    .error .dot { background: #b85c47; }
    @media (max-width: 900px), (orientation: portrait) {
      body { overflow: auto; }
      header { align-items: flex-start; }
      main { grid-template-columns: 1fr; grid-auto-rows: auto; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand"><div class="mark"></div><div><h1 id="pageTitle">Daginfo</h1><div class="subtitle" id="pageSubtitle">Algemene ruimte</div></div></div>
      <div class="clock"><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div>
    </header>
    <main id="content"></main>
    <footer><div class="status" id="status"><span class="dot"></span><span id="statusText">Actueel</span></div><div>Wordt automatisch bijgewerkt</div></footer>
  </div>
  <script src="config.js"></script>
  <script>
    var cfg = window.DAGINFO_CONFIG || {};
    document.getElementById('pageTitle').textContent = cfg.title || 'Daginfo';
    document.getElementById('pageSubtitle').textContent = cfg.subtitle || '';
    var CATEGORY_ORDER = ['Programma', 'Maaltijden', 'Eten & drinken', 'Mededelingen', 'Praktisch'];

    function localISODate(d) {
      d = d || new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + day;
    }

    function updateClock() {
      var now = new Date();
      var dateFmt = new Intl.DateTimeFormat('nl-NL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      var timeFmt = new Intl.DateTimeFormat('nl-NL', { hour:'2-digit', minute:'2-digit', hour12:false });
      var date = dateFmt.format(now);
      document.getElementById('dateText').textContent = date.charAt(0).toUpperCase() + date.slice(1);
      document.getElementById('timeText').textContent = timeFmt.format(now);
    }

    function parseCSV(text) {
      var rows = [], row = [], field = '', quoted = false, i, c, n;
      for (i = 0; i < text.length; i++) {
        c = text[i]; n = text[i+1];
        if (c === '"' && quoted && n === '"') { field += '"'; i++; }
        else if (c === '"') quoted = !quoted;
        else if (c === ',' && !quoted) { row.push(field); field = ''; }
        else if ((c === '\n' || c === '\r') && !quoted) {
          if (c === '\r' && n === '\n') i++;
          row.push(field); field = '';
          if (row.join('').trim() !== '') rows.push(row);
          row = [];
        } else field += c;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      if (!rows.length) return [];
      var headers = rows.shift().map(function(h){ return h.trim().toLowerCase(); });
      return rows.map(function(r){
        var obj = {};
        headers.forEach(function(h, idx){ obj[h] = (r[idx] || '').trim(); });
        return obj;
      });
    }

    function render(rows) {
      var today = localISODate();
      var todaysRows = rows.filter(function(r){ return r.datum === today || (cfg.includeAlwaysRows !== false && r.datum === '*'); });
      todaysRows.sort(function(a,b){ return (Number(b.prioriteit||0)-Number(a.prioriteit||0)) || String(a.tijd).localeCompare(String(b.tijd)); });
      var groups = {}, cats = [], i, row, cat;
      for (i=0; i<todaysRows.length; i++) {
        row = todaysRows[i]; cat = row.categorie || 'Overig';
        if (!groups[cat]) { groups[cat] = []; cats.push(cat); }
        groups[cat].push(row);
      }
      cats.sort(function(a,b){
        var ai = CATEGORY_ORDER.indexOf(a), bi = CATEGORY_ORDER.indexOf(b);
        ai = ai === -1 ? 999 : ai; bi = bi === -1 ? 999 : bi;
        return ai-bi || a.localeCompare(b);
      });
      var content = document.getElementById('content');
      content.innerHTML = '';
      if (!cats.length) {
        var emptyCard = document.createElement('section');
        emptyCard.className = 'category';
        emptyCard.innerHTML = '<h2>Vandaag</h2><div class="empty">Er zijn voor vandaag nog geen mededelingen ingevoerd.</div>';
        content.appendChild(emptyCard); return;
      }
      cats.slice(0,4).forEach(function(category){
        var card = document.createElement('section'); card.className = 'category';
        var h = document.createElement('h2'); h.textContent = category; card.appendChild(h);
        var items = document.createElement('div'); items.className = 'items';
        groups[category].slice(0,6).forEach(function(r){
          var el = document.createElement('div'); el.className = 'item';
          var time = document.createElement('div'); time.className = 'item-time'; time.textContent = r.tijd || '•';
          var body = document.createElement('div');
          var title = document.createElement('div'); title.className = 'item-title'; title.textContent = r.titel || ''; body.appendChild(title);
          if (r.details) { var details = document.createElement('div'); details.className = 'item-details'; details.textContent = r.details; body.appendChild(details); }
          el.appendChild(time); el.appendChild(body); items.appendChild(el);
        });
        card.appendChild(items); content.appendChild(card);
      });
    }

    function setStatus(ok, text) {
      var s = document.getElementById('status');
      if (ok) s.classList.remove('error'); else s.classList.add('error');
      document.getElementById('statusText').textContent = text;
    }

    function loadData() {
      if (!cfg.sheetCsvUrl) { setStatus(false, 'Geen gegevensbron ingesteld'); return; }
      var xhr = new XMLHttpRequest();
      var joiner = cfg.sheetCsvUrl.indexOf('?') >= 0 ? '&' : '?';
      xhr.open('GET', cfg.sheetCsvUrl + joiner + '_=' + Date.now(), true);
      xhr.onreadystatechange = function(){
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          render(parseCSV(xhr.responseText)); setStatus(true, 'Actueel');
        } else { setStatus(false, 'Kan bron niet verversen'); }
      };
      xhr.onerror = function(){ setStatus(false, 'Kan bron niet verversen'); };
      xhr.send();
    }

    updateClock();
    setInterval(updateClock, 1000);
    loadData();
    setInterval(loadData, Math.max(15, Number(cfg.refreshSeconds || 60)) * 1000);
    setTimeout(function(){ location.reload(); }, 60 * 60 * 1000);
  </script>
</body>
</html>
